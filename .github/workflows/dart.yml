name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐦 Step 2: Setup Flutter (includes Dart)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 📦 Step 3: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🧹 Step 4: Analyze the code (static analysis)
      - name: Analyze project source
        run: flutter analyze

      # ✅ Step 5: Run tests
      - name: Run tests
        run: flutter test
